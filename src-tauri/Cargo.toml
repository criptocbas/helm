[package]
name = "grok-helm"
version = "0.1.0"
description = "Helm — spatial multi-agent control plane for Grok Build"
authors = ["you"]
edition = "2021"

[lib]
name = "grok_helm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
which = "7"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tauri-plugin-dialog = "2.7.1"
base64 = "0.22"
portable-pty = "0.9"
libc = "0.2"
